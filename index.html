<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/message.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./navbar.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href=""><img src="">teste logo</a>
        </div>
        <ul class="nav-links">
            <li>Embed</li>
            <li>Markdown</li>
            <li>About</li>
        </ul>
    </nav>

    <div class="container">
        <section class="left-container">
            <form id="webhook-form">
                <div class="section" id="webhook-settings">
                    <div class="dropdown-section">
                        Webhook Settings <i class="fa-solid fa-angle-down section-arrow"></i>
                    </div>
                    <div id="webhook-settings-fields" class="fields">
                            <label for="webhook-link">Webhook Link</label>
                        <div class="input-row">
                            <input type="text" id="webhook-link" autofocus placeholder="https://discord.com/api/webhooks/...">
                            <button id="submit-button" type="submit">Enviar</button>
                        </div>
                        <label for="webhook-name">Webhook Name</label>
                        <input type="text" id="webhook-name" placeholder="Webhook Name">

                        <label for="webhook-avatar">Webhook Avatar</label>
                        <div class="image-input-wrapper">
                            <input type="text" id="webhook-avatar" pattern="https?://.+" placeholder="https://">
                            <i class="fa-solid fa-upload webhook-avatar-upload-icon"></i>
                            <input type="file" id="webhook-avatar-file-input" accept="image/*">
                        </div>

                        <label for="message-content">Message Content</label>
                        <textarea rows="3" id="message-content" placeholder="Message content" maxlength="2000"></textarea>
                    </div>
                </div>
                
                <div id="embeds-form-container">
                    <div class="section embed-settings-item">
                        <div class="dropdown-section">
                            <span class="bold">Embed 1</span>
                            <button type="button" class="btn-remove" style="display:none">Remove Embed</button> 
                            <i class="fa-solid fa-angle-down section-arrow"></i>
                        </div>
                        <div class="fields disabled">

                            <label>Embed Title</label>
                            <input class="embed-title" type="text" placeholder="Title" maxlength="256">

                            <label>Embed Description</label>
                            <textarea class="embed-description" rows="3" placeholder="Description" maxlength="4096"></textarea>
                            <label>Embed Color</label>
                            <div class="color-input-wrapper">
                                <input class="embed-color" type="text" placeholder="HEX color code" value="#5865F2">
                                <i class="fa-solid fa-palette color-icon"></i>
                            </div>
                            <label>Embed Image</label>
                            <div class="image-input-wrapper">
                                <input type="text" class="embed-image" pattern="https?://.+" placeholder="https://" title="Include http://">
                                <i class="fa-solid fa-upload image-upload-icon"></i>
                                <input type="file" class="image-file-input" accept="image/*">
                            </div>
                            <div class="section mini-section">
                                <div class="dropdown-section">
                                    Thumbnail<i class="fa-solid fa-angle-down section-arrow"></i>
                                </div>
                                <div class="disabled fields">
                                    <label>Thumbnail Icon</label>
                                    <div class="image-input-wrapper">
                                        <input type="text" class="embed-thumbnail" pattern="https?://.+" title="Include http://" placeholder="https://">
                                        <i class="fa-solid fa-upload thumbnail-upload-icon"></i>
                                        <input type="file" class="thumbnail-file-input" accept="image/*">
                                    </div>
                                </div>
                            </div>
                            <div class="section mini-section">
                                <div class="dropdown-section">
                                    Author<i class="fa-solid fa-angle-down section-arrow"></i>
                                </div>
                                <div class="disabled fields">
                                    <label>Author Name</label>
                                    <input type="text" class="author-name" placeholder="Author Name">
                                    <label>Author Icon</label>
                                    <div class="image-input-wrapper">
                                        <input type="text" class="author-icon" pattern="https?://.+" title="Include http://" placeholder="https://">
                                        <i class="fa-solid fa-upload author-icon-upload-icon"></i>
                                        <input type="file" class="author-icon-file-input" accept="image/*">
                                    </div>
                                </div>
                            </div>
                            <div class="section mini-section">
                                <div class="dropdown-section">
                                    Footer<i class="fa-solid fa-angle-down section-arrow"></i>
                                </div>
                                <div class="disabled fields">
                                    <label>Footer Text</label>
                                    <input type="text" class="footer-text" placeholder="Footer Text">
                                    <label>Footer Icon</label>
                                    <div class="image-input-wrapper">
                                        <input type="text" class="footer-icon" pattern="https?://.+" title="Include http://" placeholder="https://">
                                        <i class="fa-solid fa-upload footer-icon-upload-icon"></i>
                                        <input type="file" class="footer-icon-file-input" accept="image/*">
                                    </div>
                                    <div class="input-row" style="margin-top: 5px;">
                                        <label style="margin: 0; cursor: pointer;">Add Timestamp</label>
                                        <input type="checkbox" class="embed-timestamp">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="embed-controls">
                    <button type="button" class="btn-add" id="add-embed">Add Embed</button>
                </div>
                <input type="color" id="color-picker" value="#5865F2">
            </form>
        </section>


        <section class="right-container">
            <div id="message-container">
                <div id="webhook-preview-user">
                    <a id="webhookLink" href="https://discord.com/"><img id="webhookImage" class="pfp" src="https://cdn.discordapp.com/embed/avatars/0.png"></a>
                    <div class="webhook-app">
                        <p id="webhookName" class="bold">Webhook Name</p>
                        <p id="app" class="bold">APP</p>
                    </div>
                </div>

                <div class="message">
                    <div class="discord-message">
                        <div class="discord-message-content">
                            <div class="webhook-content-div">
                                <div id="webhookContent" class="markdown">Webhook Content</div>
                            </div>
                        </div>

                        <div id="embeds-preview-container">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./src/script.js"></script>
    <script src="./src/webhookPOST.js"></script>
    <script src="./src/webhookGET.js"></script>
    <script src="./src/sections.js"></script>
    <script src="./src/imageUploader.js" type="module"></script>
</body>
</html>
